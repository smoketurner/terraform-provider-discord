# Discord API coverage: every operationId in Discord's OpenAPI spec
# (github.com/discord/discord-api-spec, specs/openapi.json at the commit pinned
# in internal/apispec/pin.go), sorted by operationId, one per line.
#
# status:
#   covered       the client calls it for the listed resources (discord_x),
#                 data sources (data.discord_x), ephemeral resources
#                 (ephemeral.discord_x), list resources (list.discord_x),
#                 actions (action.discord_x) or functions
#                 (provider::discord::x)
#   planned       tracked by a roadmap issue (#57)
#   out_of_scope  not covered, for the given reason
#   pending_docs  in the spec but not yet in Discord's documentation
#
# Run `make api-coverage` after changing the client or this file.
